<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <span class="mark">Fill Zoom</span>
    <span class="host" id="host">—</span>
  </header>

  <div class="stageWrap">
    <div class="stage" id="stage">
      <div class="overhang" id="overhang"></div>
      <div class="visible" id="visible"></div>
      <div class="edge"></div>
    </div>
  </div>

  <p class="readout" id="readout">영상을 찾는 중입니다</p>

  <div class="spins" id="spins">
    <button class="spin" data-rot="0">바로</button>
    <button class="spin" data-rot="90">↻ 90°</button>
    <button class="spin" data-rot="270">↺ 90°</button>
    <button class="spin" data-rot="180">180°</button>
  </div>

  <div class="fits" id="fits">
    <button class="fit" data-fit="off">원래 크기</button>
    <button class="fit" data-fit="vertical">상하 채움</button>
    <button class="fit" data-fit="horizontal">좌우 채움</button>
    <button class="fit" data-fit="both">꽉 채움</button>
  </div>

  <div class="row">
    <label class="rowLabel" for="ratio">영상 속 그림 비율</label>
    <select id="ratio">
      <option value="0">자동</option>
      <option value="2.39">2.39 : 1</option>
      <option value="2.35">2.35 : 1</option>
      <option value="2.3333">21 : 9</option>
      <option value="2">2 : 1</option>
      <option value="1.85">1.85 : 1</option>
      <option value="1.7778">16 : 9</option>
      <option value="1.3333">4 : 3</option>
      <option value="1">1 : 1</option>
      <option value="0.5625">9 : 16</option>
      <option value="custom">직접 입력</option>
    </select>
  </div>
  <div class="row hidden" id="customRow">
    <label class="rowLabel" for="customRatio">가로 ÷ 세로</label>
    <input type="number" id="customRatio" step="0.01" min="0.2" max="5" placeholder="2.39">
  </div>
  <div class="row">
    <span class="rowLabel">영상에서 감지</span>
    <button class="wide" id="detect">재생 화면 읽어서 찾기</button>
  </div>

  <div class="row pan hidden" id="panXRow">
    <label class="rowLabel" for="panX">좌우 위치</label>
    <input type="range" id="panX" min="-100" max="100" step="1" value="0">
    <button class="mini" data-reset="panX">가운데</button>
  </div>
  <div class="row pan hidden" id="panYRow">
    <label class="rowLabel" for="panY">상하 위치</label>
    <input type="range" id="panY" min="-100" max="100" step="1" value="0">
    <button class="mini" data-reset="panY">가운데</button>
  </div>

  <p class="note" id="note"></p>

  <button class="wide full" id="fullscreen">전체화면으로 전환</button>

  <footer class="foot">
    <span>Shift+A 패널</span>
    <span>Shift+Z 채움</span>
    <span>Shift+R 회전</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
